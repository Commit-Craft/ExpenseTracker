name: Validation on Pull Request
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  VALIDATE:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download SF CLI and SGD Git Delta
        run: |
          set -euo pipefail
          npm install @salesforce/cli -g
          echo y | sf plugins install sfdx-git-delta

      - name: Get Commits
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          set -euo pipefail
          echo "sourceCommitId=${{ github.sha }}" >> "$GITHUB_ENV"

          targetBranch="${{ github.base_ref }}"
          if [ -z "$targetBranch" ]; then
            targetBranch="main"
          fi

          echo "targetBranch=$targetBranch" >> "$GITHUB_ENV"

          last_successful_commit=$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/Deployment.yaml/runs" \
          --jq '.workflow_runs[] | select(.head_branch=="'"$targetBranch"'") | select(.status=="completed") | select(.conclusion=="success") | .head_sha' \
          | head -1 || true)

          if [ -z "$last_successful_commit" ]; then
            last_successful_commit=$(git rev-parse origin/$targetBranch)
          fi

          echo "last_successful_commit=$last_successful_commit" >> "$GITHUB_ENV"

      - name: Generate Package
        run: |
          set -euo pipefail
          sf sgd source delta --to $sourceCommitId --from $last_successful_commit --output-dir .
          if [ ! -f package/package.xml ]; then
            mkdir -p package
            echo '<?xml version="1.0" encoding="UTF-8"?><Package xmlns="http://soap.sforce.com/2006/04/metadata"><version>67.0</version></Package>' > package/package.xml
          fi

      - name: Authenticate SF ORG
        run: |
          set -euo pipefail
          echo "${{secrets.SFDX_AUTH_URL}}" > authurl.txt
          sf org login sfdx-url --sfdx-url-file authurl.txt --set-default --alias "DEVORG"
          rm -f authurl.txt

      - name: Upload Package.xml
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package/package.xml

      - name: Validate
        run: |
          if grep -q '<types>' package/package.xml; then
            sf project deploy start -x package/package.xml -l RunSpecifiedTests --tests "RecurringPaymentSchedulerTest"
          else
            echo "No Changes to Validate"
          fi
