name: Validation on Pull Request
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  VALIDATE:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download SF CLI and SGD Git Delta
        run: |
          npm install @salesforce/cli -g
          echo y | sf plugins install sfdx-git-delta

      - name: Get Commits
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          echo "sourceCommitId=${{ github.sha }}" >> "$GITHUB_ENV"

          #echo "SOURCE_COMMIT_ID=$(git log --oneline | tail -1 | grep "commit" | cut -d' ' -f 1)" >> "$GITHUB_ENV"

          echo "targetBranch=${{ github.base_ref }}" >> "$GITHUB_ENV"

          last_successful_commit=$(gh api "repos/${{ github.repository }}/actions/workflows/Deployment.yml/runs --jq '.workflow_runs[] | select(.head_branch == "'"$targetBranch\"'") | select(.status == \"completed\") | select(.conclusion == \"success\") | .head_sha' | head -1 || true)
          
          if [ -z "$last_successful_commit" ]; then
            last_successful_commit=$(git rev-parse origin/$targetBranch)
          fi

          echo "last_successful_commit=$last_successful_commit" >> "$GITHUB_ENV"

      - name: Generate Package
        run: |
          sf sgd source delta --to $last_successful_commit --from $sourceCommitId --output-dir .

      - name: Authenticate SF ORG
        run: |
          echo "${{secrets.SFDX_AUTH_URL}}" > authurl.txt
          sf org login sfdx-url --sfdx-url-file authurl.txt --set-default --alias "DEVORG"
      
      - name: Download Package.xml
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package/package.xml
      - name: Validate
        run: |
          if grep -q '<types>' package/package.xml; then
            sf project deploy start -x package/package.xml -l RunSpecifiedTests --tests "RecurringPaymentSchedulerTest"
          else
            echo "No Changes to Validate"
          fi
